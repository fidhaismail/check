source [find interface/xds110.cfg]
transport select swd
source [find target/swj-dp.tcl]
set CHIPNAME mspm0l2228
set ENDIAN little
adapter speed 1000
set _CPUTAPID 0x0bc11477
swj_newdap ${CHIPNAME} cpu -expected-id ${_CPUTAPID}
dap create ${CHIPNAME}.dap -chain-position ${CHIPNAME}.cpu
target create ${CHIPNAME}.cpu cortex_m -endian ${ENDIAN} -dap ${CHIPNAME}.dap
${CHIPNAME}.cpu configure -work-area-phys 0x20000000 -work-area-size 0x4000 -work-area-backup 0
init
halt
